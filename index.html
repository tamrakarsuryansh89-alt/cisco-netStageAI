<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NetSage AI</title>
<style>
  :root {
    --bg: #050a12;
    --surface: #0b1220;
    --border: #1a2e4a;
    --accent: #00d4ff;
    --accent2: #7b2fff;
    --text: #c9d8e8;
    --muted: #4a6080;
    --error: #ff4d6d;
    --success: #00ffaa;
    --font: 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { background: rgba(0,212,255,0.06); top: -200px; left: -200px; }
  .orb2 { background: rgba(123,47,255,0.06); bottom: -200px; right: -200px; }

  /* Layout */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(0,212,255,0.3);
    flex-shrink: 0;
  }

  .logo-text h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
  }

  .logo-text p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .status-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--success);
    letter-spacing: 1px;
  }

  .status-dot::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .tab {
    padding: 10px 20px;
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
  }

  .tab:hover { color: var(--accent); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }

  .card-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Grid for CLI inputs */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

  textarea {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    padding: 12px;
    resize: vertical;
    min-height: 120px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.6;
  }

  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  textarea::placeholder { color: var(--muted); }

  .field-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* Prompt input */
  .prompt-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .prompt-row textarea {
    min-height: 80px;
    flex: 1;
  }

  /* Buttons */
  .btn {
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 0 20px rgba(0,212,255,0.2);
  }

  .btn-primary:hover {
    box-shadow: 0 0 30px rgba(0,212,255,0.4);
    transform: translateY(-1px);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    align-items: center;
  }

  /* Spinner */
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .result-box {
    margin-top: 20px;
    display: none;
  }

  .result-box.visible { display: block; }

  /* Issue list */
  .issue-list { list-style: none; }

  .issue-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
    border: 1px solid transparent;
  }

  .issue-item.error {
    background: rgba(255,77,109,0.08);
    border-color: rgba(255,77,109,0.2);
    color: #ffb3c1;
  }

  .issue-item.success {
    background: rgba(0,255,170,0.06);
    border-color: rgba(0,255,170,0.15);
    color: var(--success);
  }

  .issue-icon { flex-shrink: 0; margin-top: 1px; }

  /* Suggested checks */
  .check-tag {
    display: inline-block;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    color: var(--accent);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    margin: 4px;
    font-family: var(--font);
  }

  /* AI response */
  .ai-response {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    min-height: 80px;
  }

  /* Status badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .badge.ok { background: rgba(0,255,170,0.1); color: var(--success); border: 1px solid rgba(0,255,170,0.2); }
  .badge.fail { background: rgba(255,77,109,0.1); color: var(--error); border: 1px solid rgba(255,77,109,0.2); }

  /* Scan header row */
  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Typing cursor */
  .typing::after {
    content: '▋';
    animation: blink 1s step-end infinite;
    color: var(--accent);
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo-icon">⬡</div>
    <div class="logo-text">
      <h1>NetSage AI</h1>
      <p>Cisco Network Troubleshooting Assistant</p>
    </div>
    <div class="status-dot">ONLINE</div>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('checker')">⬡ Config Checker</button>
    <button class="tab" onclick="switchTab('ai')">◈ AI Assistant</button>
  </div>

  <!-- Tab: Config Checker -->
  <div class="panel active" id="tab-checker">
    <div class="card">
      <div class="card-label">CLI Inputs — Paste Cisco IOS Output</div>
      <div class="grid-2">
        <div>
          <div class="field-label">show ip interface brief</div>
          <textarea id="interface_brief" placeholder="Interface   IP-Address  OK? Method Status   Protocol&#10;Fa0/0       10.0.0.1    YES manual up       up&#10;Fa0/1       unassigned  YES unset  administratively down down"></textarea>
        </div>
        <div>
          <div class="field-label">show run</div>
          <textarea id="show_run" placeholder="interface FastEthernet0/0&#10; ip address 10.0.0.1 255.255.255.0&#10;interface FastEthernet0/0.10&#10; encapsulation dot1Q 10&#10; ip address 192.168.10.1 255.255.255.0"></textarea>
        </div>
        <div>
          <div class="field-label">show vlan brief</div>
          <textarea id="show_vlan_brief" placeholder="VLAN Name                             Status    Ports&#10;1    default                          active    Fa0/1&#10;10   MGMT                             active    Fa0/2"></textarea>
        </div>
        <div>
          <div class="field-label">show ip route</div>
          <textarea id="show_ip_route" placeholder="C    10.0.0.0/24 is directly connected, Fa0/0&#10;S*   0.0.0.0/0 [1/0] via 10.0.0.254"></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btn-check" onclick="runCheck()">
          <span class="spinner" id="spin-check"></span>
          ⬡ Run Diagnostics
        </button>
        <button class="btn btn-ghost" onclick="clearChecker()">✕ Clear</button>
      </div>
    </div>

    <!-- Results -->
    <div class="result-box" id="check-result">
      <div class="card">
        <div class="result-header">
          <div class="card-label" style="margin:0">Diagnostic Report</div>
          <span id="check-badge" class="badge"></span>
        </div>

        <div id="issues-section" style="margin-bottom:20px; display:none">
          <div class="field-label" style="margin-bottom:10px">Detected Issues</div>
          <ul class="issue-list" id="issues-list"></ul>
        </div>

        <div id="checks-section" style="display:none">
          <div class="field-label" style="margin-bottom:10px">Suggested Commands</div>
          <div id="checks-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab: AI Assistant -->
  <div class="panel" id="tab-ai">
    <div class="card">
      <div class="card-label">Ask NetSage AI</div>
      <div class="prompt-row">
        <textarea id="ai-prompt" placeholder="e.g. Why is my OSPF neighborship not forming between R1 and R2?&#10;Paste any relevant CLI output here too..." rows="4"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-ai" onclick="runAI()">
          <span class="spinner" id="spin-ai"></span>
          ◈ Ask AI
        </button>
        <button class="btn btn-ghost" onclick="clearAI()">✕ Clear</button>
      </div>
    </div>

    <div class="result-box" id="ai-result">
      <div class="card">
        <div class="card-label">AI Response</div>
        <div class="ai-response" id="ai-response-text"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const API = 'http://localhost:3000';

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    event.target.classList.add('active');
  }

  function setLoading(btnId, spinId, loading) {
    const btn = document.getElementById(btnId);
    const spin = document.getElementById(spinId);
    btn.disabled = loading;
    spin.style.display = loading ? 'block' : 'none';
  }

  async function runCheck() {
    const payload = {
      interface_brief: document.getElementById('interface_brief').value.trim(),
      show_run:        document.getElementById('show_run').value.trim(),
      show_vlan_brief: document.getElementById('show_vlan_brief').value.trim(),
      show_ip_route:   document.getElementById('show_ip_route').value.trim(),
    };

    if (!Object.values(payload).some(v => v)) {
      alert('Paste at least one CLI output to analyse.');
      return;
    }

    setLoading('btn-check', 'spin-check', true);

    try {
      const res = await fetch(`${API}/ai/check`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      renderCheckResult(data);
    } catch (e) {
      alert('Could not reach the server. Make sure it is running on port 3000.');
    } finally {
      setLoading('btn-check', 'spin-check', false);
    }
  }

  function renderCheckResult(data) {
    const box    = document.getElementById('check-result');
    const badge  = document.getElementById('check-badge');
    const issuesSec  = document.getElementById('issues-section');
    const checksSec  = document.getElementById('checks-section');
    const issuesList = document.getElementById('issues-list');
    const checksList = document.getElementById('checks-list');

    box.classList.add('visible');

    if (data.has_errors) {
      badge.className = 'badge fail';
      badge.textContent = `✕ ${data.detected_issues.length} Issue${data.detected_issues.length > 1 ? 's' : ''} Found`;
    } else {
      badge.className = 'badge ok';
      badge.textContent = '✓ No Issues Detected';
    }

    issuesList.innerHTML = '';
    if (data.detected_issues && data.detected_issues.length) {
      issuesSec.style.display = 'block';
      data.detected_issues.forEach(issue => {
        const li = document.createElement('li');
        li.className = 'issue-item error';
        li.innerHTML = `<span class="issue-icon">⚠</span><span>${issue}</span>`;
        issuesList.appendChild(li);
      });
    } else {
      issuesSec.style.display = 'block';
      const li = document.createElement('li');
      li.className = 'issue-item success';
      li.innerHTML = `<span class="issue-icon">✓</span><span>All checks passed. No configuration errors detected.</span>`;
      issuesList.appendChild(li);
    }

    checksList.innerHTML = '';
    if (data.suggested_checks && data.suggested_checks.length) {
      checksSec.style.display = 'block';
      data.suggested_checks.forEach(cmd => {
        const tag = document.createElement('span');
        tag.className = 'check-tag';
        tag.textContent = cmd;
        checksList.appendChild(tag);
      });
    } else {
      checksSec.style.display = 'none';
    }
  }

  async function runAI() {
    const prompt = document.getElementById('ai-prompt').value.trim();
    if (!prompt) { alert('Enter a prompt first.'); return; }

    setLoading('btn-ai', 'spin-ai', true);
    const resultBox = document.getElementById('ai-result');
    const responseEl = document.getElementById('ai-response-text');
    resultBox.classList.add('visible');
    responseEl.textContent = '';
    responseEl.classList.add('typing');

    try {
      const res = await fetch(`${API}/ai/get-review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      responseEl.classList.remove('typing');
      typeText(responseEl, typeof data === 'string' ? data : JSON.stringify(data, null, 2));
    } catch (e) {
      responseEl.classList.remove('typing');
      responseEl.textContent = 'Error: Could not reach the server.';
    } finally {
      setLoading('btn-ai', 'spin-ai', false);
    }
  }

  function typeText(el, text) {
    let i = 0;
    el.textContent = '';
    const interval = setInterval(() => {
      el.textContent += text[i++];
      if (i >= text.length) clearInterval(interval);
    }, 8);
  }

  function clearChecker() {
    ['interface_brief','show_run','show_vlan_brief','show_ip_route'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('check-result').classList.remove('visible');
  }

  function clearAI() {
    document.getElementById('ai-prompt').value = '';
    document.getElementById('ai-result').classList.remove('visible');
  }
</script>
</body>
</html>
